name: Linux WPE bundle checks

on:
  pull_request:
    paths:
      - "flutter_inappwebview_linux/**"
      - ".github/workflows/linux-wpe-bundle.yaml"
  push:
    branches:
      - master
      - fix/linux-wpe-self-contained
    paths:
      - "flutter_inappwebview_linux/**"
      - ".github/workflows/linux-wpe-bundle.yaml"

permissions:
  contents: read

jobs:
  texture-fallback:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
      - name: Install native texture test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libepoxy-dev libegl1-mesa-dev libgl1-mesa-dri
      - run: flutter precache --linux
      - name: Test EGL pixel upload fallback
        run: flutter_inappwebview_linux/linux/test/run_egl_texture_fallback_test.sh

  runtime-paths:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install GLib development files
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev pkg-config
      - name: Check patch whitespace
        run: git diff --check HEAD^
      - name: Test explicit GDK scale parsing
        run: flutter_inappwebview_linux/linux/test/run_gdk_scale_test.sh
      - name: Test WPEPlatform SDK dependency probe
        run: flutter_inappwebview_linux/linux/test/run_wpe_probe_link_test.sh
      - name: Test bundled WPE runtime path selection
        run: flutter_inappwebview_linux/linux/test/run_wpe_bundle_paths_test.sh
